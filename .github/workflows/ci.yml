name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: No third-party runtime dependencies
        # deliberately not parsed with tomllib -- that is Python 3.11+, and this matrix has 3.9
        run: |
          if grep -qE '^dependencies = \[\]\s*$' pyproject.toml; then
            echo "runtime dependencies: none"
          else
            echo "::error::pyproject.toml must declare no runtime dependencies"
            grep -n '^dependencies' pyproject.toml || true
            exit 1
          fi

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the example dataset
        run: |
          python -m spc report examples/bore_diameter.csv --value value \
            --lsl 9.90 --usl 10.10 --feature "bore diameter" --units mm --out /tmp/spc-out
          test -s /tmp/spc-out/chart.svg
          test -s /tmp/spc-out/report.md
          head -1 /tmp/spc-out/chart.svg | grep -q '<svg'
